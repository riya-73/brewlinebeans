services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brewline
      POSTGRES_USER: brewline
      POSTGRES_PASSWORD: brewline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://brewline:brewline@db:5432/brewline
      CORS_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
