<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppliers — Brewline Coffee Co.</title>
  <meta name="description" content="Supplier directory with pricing, lead times, quality and reliability scores." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<script src="data.js"></script>
<script src="layout.js"></script>
<script>
renderLayout('suppliers.html');

const ingredients = ["All", ...Array.from(new Set(suppliers.map(s => s.ingredient)))];
let activeFilter = "All";

function renderPage() {
  const rows = activeFilter === 'All' ? suppliers : suppliers.filter(s => s.ingredient === activeFilter);

  document.getElementById('page-content').innerHTML = `
    <div class="container">
      <div class="page-header-row">
        <div>
          <span class="page-eyebrow">Procurement</span>
          <h1 class="page-title" style="font-size:clamp(1.75rem,4vw,2.5rem);">Supplier Management</h1>
          <p class="page-desc">${suppliers.length} active supplier records across the ingredient catalog.</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-row" id="supplier-filters">
        ${ingredients.map(ing => `
          <button class="filter-pill sm ${activeFilter === ing ? 'active' : ''}" data-ing="${ing}">${ing}</button>
        `).join('')}
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrap">
          <table id="supplier-table" class="supplier-table">
            <thead>
              <tr>
                <th>Supplier</th>
                <th>Ingredient</th>
                <th class="right">Price / Unit</th>
                <th class="right">Lead Time</th>
                <th class="right">Quality</th>
                <th class="right">Reliability</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(s => `
                <tr id="supplier-row-${s.id}" class="supplier-row" data-supplier-id="${s.id}">
                  <td class="strong">${s.name}</td>
                  <td style="color:oklch(0.22 0.04 45/0.8)">${s.ingredient}</td>
                  <td class="right">₹${s.pricePerUnit}<span class="muted">/${s.unit}</span></td>
                  <td class="right muted">${s.leadTimeDays} days</td>
                  <td class="right">
                    <span style="display:inline-flex;align-items:center;gap:0.25rem;font-variant-numeric:tabular-nums;">
                      <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                      ${s.qualityScore.toFixed(1)}
                    </span>
                  </td>
                  <td class="right reliability-val">${s.reliability}%</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById('supplier-filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-pill');
    if (!btn) return;
    activeFilter = btn.dataset.ing;
    renderPage();
  });
}

renderPage();
</script>
</body>
</html>
