<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Operations — Brewline</title><link rel="stylesheet" href="styles.css" /></head>
<body><script src="layout.js"></script><script>
renderLayout('operations.html');
const root = document.getElementById('page-content');
root.innerHTML = `<div class="container"><span class="page-eyebrow">Inventory control</span><h1 class="page-title" style="font-size:clamp(1.75rem,4vw,2.5rem);">Batches & Alerts</h1><p class="page-desc">FEFO batch visibility and automated stock/expiry notifications.</p><div class="panel-grid" style="margin-top:2rem"><section class="card panel"><div class="panel-header"><div class="panel-title">Active batches</div><div class="panel-sub">Sorted by earliest expiry</div></div><div class="table-wrap"><table><thead><tr><th>Lot</th><th>Ingredient</th><th>Quantity</th><th>Expires</th><th>Status</th></tr></thead><tbody id="batch-rows"></tbody></table></div></section><section class="card panel"><div class="panel-header"><div class="panel-title">Notifications</div><div class="panel-sub">Low stock and expiry alerts</div></div><div id="alerts"></div></section></div></div>`;
const api = async path => { const r = await fetch(path); if (!r.ok) throw new Error(await r.text()); return r.json(); };
(async () => { try { const [batches, inventory, alerts] = await Promise.all([api('/api/operations/batches'), api('/api/inventory'), api('/api/operations/alerts')]); const names = Object.fromEntries(inventory.map(i => [i.id, i.name])); document.getElementById('batch-rows').innerHTML = batches.map(b => `<tr><td class="mono">${b.lot_number}</td><td>${names[b.ingredient_id] || b.ingredient_id}</td><td>${b.quantity}</td><td>${b.expires_on}</td><td><span class="badge healthy">${b.status}</span></td></tr>`).join('') || '<tr><td colspan="5">No active batches.</td></tr>'; document.getElementById('alerts').innerHTML = alerts.map(a => `<div class="card" style="padding:0.75rem;margin-bottom:0.75rem"><span class="badge ${a.severity === 'CRITICAL' ? 'critical' : 'low'}">${a.severity}</span><p style="margin-top:.5rem">${a.message}</p></div>`).join('') || '<p class="muted">No alerts.</p>'; } catch (e) { document.getElementById('alerts').textContent = `API unavailable: ${e.message}`; } })();
</script></body></html>
